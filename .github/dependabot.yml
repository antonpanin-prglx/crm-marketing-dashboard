# NOTE: this file is copied verbatim into every app scaffolded from this template
# (`create-app.sh` uses `gh repo create --template`), so it has to be correct for a
# real app — not for this repo. The template itself carries no package.json, so its
# OWN weekly npm run reports `dependency_file_not_found: /package.json` and shows a
# red "Dependabot Updates" run here. That is expected and harmless: there are no npm
# dependencies in this repo to go unpatched. Do NOT "fix" it by deleting the npm
# block below — that would silently disable dependency updates for every app ever
# created from this template.
version: 2
updates:
  # npm dependencies — open PRs to fix known-vulnerable / outdated packages.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait 7 days after a release before opening a bump PR — a newly published
    # version can be malicious or unstable; the cooldown lets bad releases get
    # yanked before we pull them in.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # Group routine bumps into one PR to cut noise; security fixes still
      # come through promptly.
      all-dependencies:
        patterns: ["*"]
    ignore:
      # TypeScript 7 is the native (Go) port: it ships as @typescript/typescript-<platform>
      # binaries and dropped the JS compiler API that Next 16.2.x's typecheck step calls.
      # A v7 bump compiles fine and then fails the build with "TypeScript 7.x does not
      # provide the compiler API required by Next.js" — which is exactly how it broke the
      # Vercel deploys on Global-Campaign-Calendar #57, Global-Sales-QA-Tool #28 and
      # Performance-Marketing-KPI-Dashboard #15. Lift this once Next ships TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]

  # Keep the GitHub Actions used by the security workflow up to date too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["ci"]
